name: Desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (for example v0.2.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux (amd64)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/desktop/go.mod
          cache-dependency-path: |
            apps/desktop/go.sum
            go.work.sum

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: pnpm

      - name: Install WebKitGTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm run build

      - name: Build desktop app
        working-directory: apps/desktop
        run: wails build -platform linux/amd64 -o assets-toolbox-linux-amd64 -trimpath -ldflags "-s -w"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: apps/desktop/build/bin/assets-toolbox-linux-amd64
          if-no-files-found: error

  windows:
    name: Windows (amd64)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/desktop/go.mod
          cache-dependency-path: |
            apps/desktop/go.sum
            go.work.sum

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: pnpm

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm run build

      - name: Build desktop app
        working-directory: apps/desktop
        run: wails build -platform windows/amd64 -o assets-toolbox-windows-amd64.exe -trimpath -ldflags "-s -w"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: apps/desktop/build/bin/assets-toolbox-windows-amd64.exe
          if-no-files-found: error

  macos:
    name: macOS (universal)
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/desktop/go.mod
          cache-dependency-path: |
            apps/desktop/go.sum
            go.work.sum

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: pnpm

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm run build

      - name: Build desktop app
        working-directory: apps/desktop
        run: wails build -platform darwin/universal -trimpath -ldflags "-s -w"

      - name: Archive app bundle
        working-directory: apps/desktop/build/bin
        run: zip -qry ../../../../assets-toolbox-darwin-universal.zip assets-toolbox.app

      - uses: actions/upload-artifact@v4
        with:
          name: darwin-universal
          path: assets-toolbox-darwin-universal.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Assets Toolbox ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/assets-toolbox-linux-amd64
            dist/assets-toolbox-windows-amd64.exe
            dist/assets-toolbox-darwin-universal.zip
            dist/SHA256SUMS
