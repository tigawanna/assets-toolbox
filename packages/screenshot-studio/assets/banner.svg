<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Screenshot Studio</title>
  <desc id="desc">Local canvas for Google Play and App Store listing screenshots.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#bef264" fill-opacity="0.12" />
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="28" fill="#121a14" />
  <rect width="1200" height="320" rx="28" fill="url(#dots)" />
  <g transform="translate(72 88) scale(2.25)">
    <rect width="64" height="64" rx="16" fill="#1b261d" />
    <rect x="19" y="7" width="26" height="50" rx="7" fill="none" stroke="#bef264" stroke-width="4" />
    <rect x="24" y="14" width="16" height="36" rx="3" fill="#bef264" fill-opacity="0.16" />
    <circle cx="36" cy="24" r="2" fill="#bef264" />
    <path d="M26 41l4-7 3 4 3-4 4 7" fill="none" stroke="#bef264" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="248" y="158" fill="#eef1ec" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="66" font-weight="700" letter-spacing="-2">Screenshot <tspan fill="#bef264">Studio</tspan></text>
  <text x="252" y="212" fill="#9aa89c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="26">One canvas for Play and App Store listings</text>
  <g transform="translate(252 250)">
    <rect width="148" height="34" rx="17" fill="#bef264" fill-opacity="0.12" />
    <text x="74" y="22" text-anchor="middle" fill="#bef264" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" letter-spacing="1">LOCAL · MCP · PNG</text>
  </g>
</svg>
